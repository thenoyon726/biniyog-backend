<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>সাপোর্ট - বিনিয়োগ অ্যাপ</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --primary: #10b981;
    --primary-dark: #059669;
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #263148;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;
    --user-bubble: #10b981;
    --admin-bubble: #263148;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .chat-header {
    background: var(--surface);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--surface2);
    border: none;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    flex-shrink: 0;
  }
  .agent-avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    position: relative;
  }
  .online-dot {
    position: absolute; bottom: 1px; right: 1px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #22c55e;
    border: 2px solid var(--surface);
  }
  .agent-info { flex: 1; }
  .agent-name { font-size: 15px; font-weight: 700; }
  .agent-status { font-size: 12px; color: #22c55e; font-weight: 500; }

  /* ── Messages Area ── */
  .messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .messages-area::-webkit-scrollbar { width: 4px; }
  .messages-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* date separator */
  .date-sep {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin: 6px 0;
    display: flex; align-items: center; gap: 8px;
  }
  .date-sep::before, .date-sep::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  /* bubbles */
  .msg-row {
    display: flex;
    gap: 8px;
    max-width: 88%;
    animation: fadeUp 0.25s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.admin { align-self: flex-start; }

  .bubble-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    align-self: flex-end;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
    max-width: 100%;
    word-break: break-word;
  }
  .msg-row.admin .bubble {
    background: var(--admin-bubble);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
    color: #fff;
  }
  .bubble-time {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
    text-align: right;
    padding: 0 4px;
  }
  .msg-row.admin .bubble-time { text-align: left; }

  /* typing indicator */
  .typing-row {
    display: flex; gap: 8px; align-self: flex-start;
    align-items: flex-end;
  }
  .typing-bubble {
    background: var(--admin-bubble);
    border-radius: 18px 18px 18px 4px;
    padding: 12px 16px;
    display: flex; gap: 5px; align-items: center;
  }
  .typing-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: typingBounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }

  /* empty state */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; color: var(--text-muted);
    padding: 32px;
    text-align: center;
  }
  .empty-state .icon { font-size: 52px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* loading */
  .loading-wrap {
    flex: 1; display: flex;
    align-items: center; justify-content: center;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Input Area ── */
  .input-area {
    padding: 12px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  .msg-input {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 22px;
    padding: 11px 16px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    resize: none;
    max-height: 120px;
    outline: none;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  .msg-input:focus { border-color: var(--primary); }
  .msg-input::placeholder { color: var(--text-muted); }
  .send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--primary);
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.15s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: var(--primary-dark); }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; }

  /* quick replies */
  .quick-replies {
    padding: 8px 16px 0;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
  }
  .quick-replies::-webkit-scrollbar { display: none; }
  .quick-chip {
    white-space: nowrap;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: 'Manrope', sans-serif;
    color: var(--text);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .quick-chip:hover { background: var(--primary); border-color: var(--primary); }

  /* toast */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: var(--text);
    padding: 10px 20px; border-radius: 24px;
    font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    z-index: 9999;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: #065f46; color: #6ee7b7; }
  .toast.error { background: #7f1d1d; color: #fca5a5; }

  /* not-logged-in */
  .login-prompt {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; padding: 32px; text-align: center;
  }
  .login-prompt .icon { font-size: 56px; }
  .login-prompt h2 { font-size: 18px; }
  .login-prompt p { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
  .btn-login {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Manrope', sans-serif;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="chat-header">
  <a href="dashboard.html" class="back-btn">←</a>
  <div class="agent-avatar">
    🎧
    <div class="online-dot"></div>
  </div>
  <div class="agent-info">
    <div class="agent-name">বিনিয়োগ সাপোর্ট</div>
    <div class="agent-status">● অনলাইন</div>
  </div>
</div>

<!-- Content will be injected here -->
<div id="chatBody" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
  <div class="loading-wrap"><div class="spinner"></div></div>
</div>

<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
const API_BASE = 'https://biniyog-backend.onrender.com/api';

const QUICK_REPLIES = [
  'আমার ব্যালেন্স যোগ হয়নি',
  'উইথড্র করতে পারছি না',
  'ডিপোজিট করেছি কিন্তু আপডেট নেই',
  'প্ল্যান সক্রিয় হয়নি',
  'অন্য সমস্যা',
];

let chatId = null;
let token = null;

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

function timeStr(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
}

function buildBubble(msg) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + msg.sender;
  const isAdmin = msg.sender === 'admin';

  row.innerHTML = `
    ${isAdmin ? `<div class="bubble-avatar">🎧</div>` : ''}
    <div>
      <div class="bubble">${escapeHtml(msg.message)}</div>
      <div class="bubble-time">${timeStr(msg.createdAt || new Date())}</div>
    </div>
  `;
  return row;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function showTyping(area) {
  const row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typingIndicator';
  row.innerHTML = `
    <div class="bubble-avatar">🎧</div>
    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>`;
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

function renderChat(chat) {
  const body = document.getElementById('chatBody');
  body.innerHTML = '';

  // messages area
  const area = document.createElement('div');
  area.className = 'messages-area';
  area.id = 'messagesArea';

  if (chat.messages && chat.messages.length > 0) {
    const sep = document.createElement('div');
    sep.className = 'date-sep';
    sep.textContent = 'আজকের কথোপকথন';
    area.appendChild(sep);

    chat.messages.forEach(msg => {
      area.appendChild(buildBubble(msg));
    });
  }

  body.appendChild(area);
  area.scrollTop = area.scrollHeight;

  // quick replies (only if last message is admin)
  const lastMsg = chat.messages && chat.messages[chat.messages.length - 1];
  if (!lastMsg || lastMsg.sender === 'admin') {
    const qr = document.createElement('div');
    qr.className = 'quick-replies';
    qr.id = 'quickReplies';
    QUICK_REPLIES.forEach(text => {
      const chip = document.createElement('button');
      chip.className = 'quick-chip';
      chip.textContent = text;
      chip.onclick = () => sendMessage(text);
      qr.appendChild(chip);
    });
    body.appendChild(qr);
  }

  // input area
  const inputArea = document.createElement('div');
  inputArea.className = 'input-area';
  inputArea.innerHTML = `
    <textarea class="msg-input" id="msgInput" placeholder="আপনার সমস্যা লিখুন..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendFromInput()">➤</button>
  `;
  body.appendChild(inputArea);

  // auto-resize textarea
  const ta = document.getElementById('msgInput');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendFromInput();
    }
  });
}

function renderLoginPrompt() {
  const body = document.getElementById('chatBody');
  body.innerHTML = `
    <div class="login-prompt">
      <div class="icon">🔐</div>
      <h2>লগিন করুন</h2>
      <p>সাপোর্ট চ্যাট ব্যবহার করতে আপনাকে প্রথমে লগিন করতে হবে।</p>
      <a href="login.html" class="btn-login">লগিন করুন</a>
    </div>
  `;
}

async function loadChat() {
  token = localStorage.getItem('biniyog_token');
  if (!token) { renderLoginPrompt(); return; }

  try {
    const res = await fetch(API_BASE + '/chat', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    if (data.success) {
      chatId = data.chat._id;
      renderChat(data.chat);
    } else {
      showToast('চ্যাট লোড করা যায়নি।', 'error');
    }
  } catch (e) {
    showToast('সংযোগ সমস্যা।', 'error');
  }
}

async function sendMessage(text) {
  if (!text || !text.trim()) return;

  // remove quick replies
  const qr = document.getElementById('quickReplies');
  if (qr) qr.remove();

  const area = document.getElementById('messagesArea');
  const sendBtn = document.getElementById('sendBtn');
  if (sendBtn) sendBtn.disabled = true;

  // add user bubble immediately
  area.appendChild(buildBubble({ sender: 'user', message: text, createdAt: new Date() }));
  area.scrollTop = area.scrollHeight;

  // clear input
  const ta = document.getElementById('msgInput');
  if (ta) { ta.value = ''; ta.style.height = 'auto'; }

  // show typing
  showTyping(area);

  try {
    const res = await fetch(API_BASE + '/chat', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    removeTyping();
    if (sendBtn) sendBtn.disabled = false;

    if (!data.success) {
      showToast(data.message || 'মেসেজ পাঠানো যায়নি।', 'error');
    }
  } catch (e) {
    removeTyping();
    if (sendBtn) sendBtn.disabled = false;
    showToast('সংযোগ সমস্যা।', 'error');
  }
}

function sendFromInput() {
  const ta = document.getElementById('msgInput');
  if (!ta) return;
  const text = ta.value.trim();
  if (text) sendMessage(text);
}

// poll for new messages every 8 seconds
setInterval(async () => {
  if (!token) return;
  try {
    const res = await fetch(API_BASE + '/chat', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    if (data.success) {
      const area = document.getElementById('messagesArea');
      if (!area) return;
      const currentCount = area.querySelectorAll('.msg-row').length;
      const newCount = data.chat.messages ? data.chat.messages.length : 0;
      if (newCount > currentCount) {
        // re-render new messages
        const newMsgs = data.chat.messages.slice(currentCount);
        newMsgs.forEach(msg => {
          area.appendChild(buildBubble(msg));
        });
        area.scrollTop = area.scrollHeight;
      }
    }
  } catch(e) {}
}, 8000);

loadChat();
</script>
</body>
</html>
