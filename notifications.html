<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>নোটিফিকেশন - বিনিয়োগ অ্যাপ</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<style>
.notif-tabs { display:flex; gap:4px; background:var(--surface2); border-radius:12px; padding:4px; margin-bottom:16px; }
.notif-tab { flex:1; padding:9px 12px; border-radius:9px; font-size:12px; font-weight:700; cursor:pointer; color:var(--text3); text-align:center; transition:.15s; }
.notif-tab.active { background:var(--surface); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,0.3); }
.alert-item { display:flex; gap:12px; padding:14px; border-radius:12px; background:rgba(253,192,3,0.06); border:1px solid rgba(253,192,3,0.25); margin-bottom:8px; }
.alert-icon { width:40px; height:40px; border-radius:10px; background:rgba(253,192,3,0.15); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
</style>

<script src="shared.js"></script>
<script>
requireAuth();

let currentTab = 'notifications';

const typeColors = { success:'var(--primary-glow)', error:'var(--red-dim)', warning:'var(--gold-dim)', info:'var(--surface2)', deposit:'var(--primary-glow)', withdraw:'var(--red-dim)', profit:'var(--gold-dim)', system:'var(--blue-dim)' };

// Tab switch
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.notif-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'notifications') loadNotifications();
  else loadAlerts();
}

async function loadNotifications() {
  const data = await apiFetch('/notifications');
  const el = document.getElementById('notifList');

  // শুধু system/warning/campaign ছাড়া notifications
  const notifs = data?.notifications?.filter(n => n.type !== 'alert') || [];

  if (!data?.success || !notifs.length) {
    el.innerHTML = '<div class="empty-state"><span class="material-symbols-outlined">notifications_off</span><p>কোনো নোটিফিকেশন নেই</p></div>';
    return;
  }
  el.innerHTML = notifs.map(n => `
    <div class="notif-item ${n.isRead?'':'unread'}">
      ${!n.isRead ? '<div class="notif-dot"></div>' : ''}
      <div class="notif-icon" style="background:${typeColors[n.type]||'var(--surface2)'}">
        <span class="material-symbols-outlined" style="font-size:18px">${n.icon||'notifications'}</span>
      </div>
      <div class="notif-body">
        <div class="notif-title">${n.title}</div>
        <div class="notif-msg">${n.message}</div>
        <div class="notif-time">${formatDateTime(n.createdAt)}</div>
      </div>
      <button onclick="deleteNotif('${n._id}')" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:0 4px;align-self:flex-start">🗑</button>
    </div>
  `).join('');
}

async function loadAlerts() {
  const data = await apiFetch('/notifications');
  const el = document.getElementById('notifList');

  // শুধু warning/alert type
  const alerts = data?.notifications?.filter(n => n.type === 'warning' || n.type === 'alert' || n.icon === 'campaign') || [];

  if (!alerts.length) {
    el.innerHTML = '<div class="empty-state"><span class="material-symbols-outlined">campaign</span><p>কোনো সতর্কবার্তা নেই</p></div>';
    return;
  }
  el.innerHTML = alerts.map(n => `
    <div class="alert-item">
      <div class="alert-icon">⚠️</div>
      <div class="notif-body">
        <div class="notif-title" style="color:#b45309">${n.title}</div>
        <div class="notif-msg">${n.message}</div>
        <div class="notif-time">${formatDateTime(n.createdAt)}</div>
      </div>
      <button onclick="deleteNotif('${n._id}')" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:0 4px;align-self:flex-start">🗑</button>
    </div>
  `).join('');
}

async function markAllRead() {
  await apiFetch('/notifications/read-all', { method:'PUT' });
  showToast('সব নোটিফিকেশন পড়া হয়েছে।', 'success');
  loadNotifications();
  document.querySelectorAll('.notif-badge').forEach(b => b.style.display = 'none');
}

async function deleteNotif(id) {
  const data = await apiFetch(`/notifications/${id}`, { method: 'DELETE' });
  if (data?.success) { showToast('মুছে ফেলা হয়েছে।', 'success'); switchTab(currentTab); }
  else showToast(data?.message || 'সমস্যা।', 'error');
}

async function deleteAllNotif() {
  if (!confirm('সব নোটিফিকেশন মুছে ফেলবেন?')) return;
  const data = await apiFetch('/notifications', { method: 'DELETE' });
  if (data?.success) { showToast('সব মুছে ফেলা হয়েছে ✅', 'success'); switchTab(currentTab); }
  else showToast(data?.message || 'সমস্যা।', 'error');
}

loadNotifications();
</script>
</body>
</html>
